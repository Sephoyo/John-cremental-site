<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>John'cremental</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f1820;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
/* Écran de chargement aux couleurs du site : la ferme en fond, le titre, une barre dorée. */
body, #status { background-color: #1f1820; }
#status { gap: 18px; font-family: "Alegreya", Georgia, serif; color: #fff2d8; }
#status-splash { position: absolute; inset: 0; filter: brightness(0.45) saturate(0.9); object-fit: cover !important; }
#status-title, #status-text, #status-progress, #status-percent { position: relative; z-index: 1; }
#status-title { font-family: "MedievalSharp", Georgia, serif; font-size: clamp(2.2rem, 7vw, 4.5rem); color: #face6e;
  text-shadow: 4px 4px 0 #2a1d1a, -2px -2px 0 #2a1d1a, 2px -2px 0 #2a1d1a, -2px 2px 0 #2a1d1a; margin: 0; }
#status-text { font-size: clamp(1rem, 2.6vw, 1.35rem); text-shadow: 2px 2px 0 #2a1d1a; margin: 0; }
#status-progress { position: relative !important; bottom: auto !important; width: min(420px, 70vw) !important; height: 22px;
  appearance: none; -webkit-appearance: none; border: 3px solid #2a1d1a; border-radius: 4px; background: #4a2f22;
  box-shadow: 0 4px 0 #2a1d1a; overflow: hidden; }
#status-progress::-webkit-progress-bar { background: #4a2f22; }
#status-progress::-webkit-progress-value { background: linear-gradient(#face6e, #d6a54a 60%, #a8772f); }
#status-progress::-moz-progress-bar { background: linear-gradient(#face6e, #d6a54a 60%, #a8772f); }
#status-percent { font-size: 1rem; color: #e8d5aa; text-shadow: 2px 2px 0 #2a1d1a; margin: 0; min-height: 1.3em; }
</style>
<script>
// Titre, texte (français ou anglais selon le navigateur) et pourcentage sous la barre.
document.addEventListener("DOMContentLoaded", function () {
  var status = document.getElementById("status");
  var bar = document.getElementById("status-progress");
  if (!status || !bar) return;
  var fr = (navigator.language || "").toLowerCase().indexOf("fr") === 0;
  function line(id, tag, text) { var el = document.createElement(tag); el.id = id; el.textContent = text; return el; }
  status.insertBefore(line("status-title", "h1", "John'cremental"), bar);
  status.insertBefore(line("status-text", "p", fr ? "La ferme se réveille…" : "The farm is waking up…"), bar);
  var percent = line("status-percent", "p", "");
  status.insertBefore(percent, bar.nextSibling);
  setInterval(function () {
    percent.textContent = bar.max > 0 && bar.value > 0 ? Math.floor(100 * bar.value / bar.max) + " %" : "";
  }, 200);
});
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28096024,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
