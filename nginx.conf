# Site de John'cremental et sa démo web (servis par Dokploy, HTTPS assuré devant).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : la démo passe de 64 Mo à environ 37 Mo à télécharger (le moteur .wasm,
    # de 40 à 10 Mo ; les images et sons du .pck sont déjà compressés).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm application/octet-stream image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Le moteur du jeu : le navigateur le compile pendant le téléchargement s'il a le
    # bon type.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # Les fichiers de la démo gardent le même nom d'une version à l'autre : le navigateur
    # revérifie à chaque visite (il ne retélécharge que s'ils ont changé).
    location /demo/ {
        add_header Cache-Control "no-cache";
    }
}
